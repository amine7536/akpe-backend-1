name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-push:
    uses: amine7536/akpe-workflows/.github/workflows/build-and-push.yml@main
    with:
      image_name: ${{ github.repository }}
    secrets: inherit

  update-gitops:
    if: github.event_name == 'push'
    needs: build-and-push
    uses: amine7536/akpe-workflows/.github/workflows/update-gitops.yml@main
    with:
      service_name: backend-1
    secrets: inherit

  preview-env:
    if: github.event_name == 'pull_request'
    needs: build-and-push
    uses: amine7536/akpe-workflows/.github/workflows/preview-env.yml@main
    with:
      service_name: backend-1
    secrets: inherit
